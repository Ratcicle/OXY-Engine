name: Validação Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows · Rust 1.92.0
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Luau is C++ with exceptions and cc passes no /EH flag to MSVC by itself; cc writes each
      # compiler command to the build script output, which the step below checks.
      LUAU_CXXFLAGS: /EHsc
      CC_ENABLE_DEBUG_OUTPUT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar ferramentas Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
      - name: Formatação
        run: cargo fmt --all --check
      - name: Compilação
        run: cargo build --workspace --locked
      - name: Luau compilado com /EHsc
        shell: pwsh
        run: ./scripts/check-luau-ehsc.ps1 -BuildDirectory target/debug/build
      - name: Testes sem janela
        run: cargo test --workspace --locked
      - name: Invariantes e contadores (sem limites de tempo)
        run: cargo test -p oxy_core --features profiling --locked
      - name: Análise estática
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
