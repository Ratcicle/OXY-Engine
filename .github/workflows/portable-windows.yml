name: Distribuição portátil Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  # By hand on any branch too, as a feature branch is checked before merging:
  # gh workflow run portable-windows.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      # Luau is C++ with exceptions and cc passes no /EH flag to MSVC by itself; cc writes each
      # compiler command to the build script output, which the step after the build checks.
      LUAU_CXXFLAGS: /EHsc
      CC_ENABLE_DEBUG_OUTPUT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar Rust para Windows x64
        run: rustup toolchain install 1.92.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages | Where-Object name -eq 'oxy_editor' | Select-Object -ExpandProperty version
          $version = $version.Replace("+patch.", ".")
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG não corresponde à versão $version do editor." }
      - name: Compilar com runtime C estático
        run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: Luau compilado com /EHsc
        shell: pwsh
        run: ./scripts/check-luau-ehsc.ps1 -BuildDirectory target/x86_64-pc-windows-msvc/release/build
      # The ZIP's build is the only one with Luau's C++ in release with the static runtime (-MT):
      # ci.yml builds dev with -MD. The script tests of oxy_core run on it, among them the
      # engine's errors (Rust) crossing Luau's C++ exceptions to a script's pcall and back, the
      # host's panic barrier and the parkour in Luau played against the 0.6 graph.
      - name: Testar scripts em release
        run: 'cargo test -p oxy_core --release --locked --target x86_64-pc-windows-msvc --lib --test integration -- script parkour_ab::'
      - name: Testar
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc
      - name: Gerar ZIP e checksum
        shell: pwsh
        run: ./scripts/package-engine.ps1 -SkipBuild -BinaryDirectory target/x86_64-pc-windows-msvc/release
      - name: Validar conteúdo portátil
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/OXY-Engine-*-windows-x64.zip | Select-Object -First 1
          ./scripts/test-portable.ps1 -Zip $zip.FullName -ContentOnly
      - uses: actions/upload-artifact@v4
        with:
          name: OXY-Engine-windows-x64
          path: |
            dist/OXY-Engine-*-windows-x64.zip
            dist/OXY-Engine-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OXY-Engine-windows-x64
          path: release
      - name: Anexar ZIP à GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "OXY Engine $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/*.sha256 --clobber
