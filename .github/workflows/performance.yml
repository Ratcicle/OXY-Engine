name: Medições CPU (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.92.0 --profile minimal
      - name: Cenários determinísticos em release
        shell: pwsh
        run: |
          ./scripts/benchmark.ps1 -Label "manual-$env:GITHUB_RUN_ID"
          ./scripts/benchmark.ps1 -Label "manual-extra-$env:GITHUB_RUN_ID" -Example performance_extra
          ./scripts/benchmark.ps1 -Label "manual-mesh-$env:GITHUB_RUN_ID" -Example performance_mesh -Sizes '22,70,158'
          ./scripts/benchmark.ps1 -Label "manual-movement-$env:GITHUB_RUN_ID" -Example performance_movement -Sizes '1,10,50'
      - uses: actions/upload-artifact@v4
        with:
          name: oxy-cpu-measurements
          path: benchmarks/results/manual-*.json
          if-no-files-found: error
          retention-days: 30
